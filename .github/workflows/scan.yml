name: CryptoNotifier

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cryptonotifier-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
          echo "CHAT_ID=${{ secrets.CHAT_ID }}" >> .env

      - name: Sync repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run scanner
        run: python src/main.py

      - name: Save positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/positions.json

          if git diff --cached --quiet; then
            echo "No position changes."
            exit 0
          fi

          git commit -m "Update positions"

          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin main; then
              echo "Positions saved successfully."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Failed to save positions."
          exit 1

      - name: Notify workflow failure
        if: ${{ failure() }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          bot_token=os.environ["BOT_TOKEN"]
          chat_id=os.environ["CHAT_ID"]

          message=(
              "🚨 CRYPTONOTIFIER WORKFLOW FAILED\n\n"
              f"Repository: {os.environ.get('GITHUB_REPOSITORY')}\n"
              f"Workflow: {os.environ.get('GITHUB_WORKFLOW')}\n"
              f"Run: {os.environ.get('GITHUB_RUN_NUMBER')}\n"
              f"Commit: {os.environ.get('GITHUB_SHA','')[:8]}\n\n"
              "Check GitHub Actions for the failed step."
          )

          url=f"https://api.telegram.org/bot{bot_token}/sendMessage"
          response=requests.post(
              url,
              data={
                  "chat_id":chat_id,
                  "text":message
              },
              timeout=10
          )

          response.raise_for_status()
          PY